<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Learning Action and register attributes</h2>
    <form action="/register" method="post">
        <label for="name">Name:</label>
        <input type="text" placeholder="Enter your name" id="name" name="name" value="John Doe" required minlength="2"
            maxlength="50">
        <label for="email">Email:</label>
        <input type="email" placeholder="Enter your email" id="email" name="email" value="Johndoe@gmail.com" required
            maxlength="50">
        <label for="age">Age:</label>
        <input type="number" placeholder="Enter your age" id="age" name="age" value="25" min="1" max="100">
        <br>
        <br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>

</html>
